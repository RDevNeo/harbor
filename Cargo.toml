[package]
name = "harbor"
version = "0.43.0"
edition = "2024"
description = "Native, lightweight chat client for coding agents, organised by repository"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
# arboard is eframe's clipboard backend; data-control lets it read images on
# Wayland directly. image encodes pasted screenshots as PNG (already in the tree).
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
# image also decodes previews of attached and agent-read images (gif: first frame)
# and project favicons (ico: the largest entry).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
egui_commonmark = { version = "0.26", default-features = false }
# Already in the tree through egui_commonmark: agent replies as blocks for the phone app (api.rs).
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
# QR codes (a phone scans one to install the Remote Devices app); no image/svg extras
qrcode = { version = "0.14", default-features = false }
vt100 = "0.18"
# Checks the signature of self-updates (minisign, pure Rust, no dependencies).
minisign-verify = "0.2"
# Safe waitpid, to reap children a reload left behind (procs.rs); already in the tree.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
# Harbor's own transport between PCs and phones (tls.rs): mutual TLS with pinned self-signed
# certificates, no Tailscale. ring is the one crypto backend (no aws-lc, no async runtime).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
ring = "0.17"
# getifaddrs: this PC's LAN addresses for pairing (already in the tree).
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Local runnable builds (~/.cache/harbor-rel/build.sh release): no fat LTO, parallel and
# incremental, so a one-line change doesn't re-optimise the whole program on one thread.
# Tagged releases in CI keep the release profile.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
