[package]
name = "harbor-stream"
version = "0.1.0"
edition = "2024"
description = "Remote screens for Harbor's Device panes: phones (scrcpy protocol) and PCs, decoded off-process (built separately)"
license = "GPL-3.0-or-later"

[dependencies]
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "swscale"] }
serde_json = "1"
# PCs (GameStream): pairing/TLS; moonlight-common-c is built by build.rs
openssl = { version = "0.10", optional = true }

[features]
default = ["gamestream"]
gamestream = ["dep:openssl"]

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
