<!doctype html><title>Fake Discord</title>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<div id="app"></div>
<script>
// Just enough of Discord for the tools: stores, actions, a chat view, events from the rig.
(() => {
    const rig = location.origin;
    const report = (kind, data) => navigator.sendBeacon(rig + "/rig/" + kind, JSON.stringify(data ?? {}));
    const loggedIn = !location.pathname.startsWith("/login") && !location.search.includes("nouser");
    // A dead session: Discord falls back to the login page.
    if (location.search.includes("nouser")) location.replace("/login");
    const me = { id: "100000000000000001", username: "tester", globalName: "Test User" };
    const friend = { id: "100000000000000002", username: "friend", globalName: "A Friend", bot: false };
    const channel = { id: "200000000000000001", type: 1, name: "", recipients: [friend.id], guild_id: null };
    const guild = { id: "300000000000000001", name: "Fake Server", ownerId: friend.id };
    const room = { id: "200000000000000002", type: 0, name: "general", guild_id: guild.id, recipients: [] };
    const channels = { [channel.id]: channel, [room.id]: room };
    const msg = (id, text, author = friend) => ({ id, channel_id: channel.id, content: text, author, timestamp: new Date().toISOString(), attachments: [], mentions: [], embeds: [], reactions: [] });
    const messages = [msg("400000000000000001", "hello from the fake")];
    let selected = null, memberOf = { [guild.id]: guild };
    const subs = {};
    const emit = (type, extra) => { for (const f of subs[type] ?? []) f({ type, ...extra }); };
    let nickname = null, established = true;
    // The connection after a thaw, as the rig asks: what Discord's socket would do.
    const socket = {
        lastHeartbeatAckTime: 0,
        isSessionEstablished: () => established,
        expeditedHeartbeat: async () => {
            const m = await (await fetch(rig + "/rig/thaw")).json();
            report("heartbeat", m);
            if (m.mode === "never") { established = false; emit("CONNECTION_INTERRUPTED"); return; }
            if (m.mode === "alive") { await new Promise(r => setTimeout(r, m.delay)); socket.lastHeartbeatAckTime = Date.now(); nickname = m.nickname ?? nickname; return; }
            established = false;
            emit("CONNECTION_INTERRUPTED");
            await new Promise(r => setTimeout(r, m.delay));
            nickname = m.nickname ?? nickname;
            established = true;
            emit(m.mode === "identify" ? "CONNECTION_OPEN" : "CONNECTION_RESUMED");
        },
    };
    const renamed = new URLSearchParams(location.search).has("renamed") || window.RENAMED;
    const MessageActions = {
        sendMessage: async (id, m, _wait, opts) => { report("send", { id, content: m.content, uploads: opts?.attachmentsToUpload?.length ?? 0 }); },
        [renamed ? "updateMessage" : "editMessage"]: async (id, mid, m) => report("edit", { id, mid, m }),
        deleteMessage: async (id, mid) => report("delete", { id, mid }),
    };
    const stores = {
        SelectedChannelStore: { getChannelId: () => selected, getVoiceChannelId: () => null },
        ChannelStore: { getChannel: id => channels[id], hasChannel: id => !!channels[id], getDMFromUserId: u => (u === friend.id ? channel.id : undefined) },
        GuildStore: { getGuild: id => memberOf[id], getGuilds: () => memberOf },
        UserStore: { getCurrentUser: () => (loggedIn ? me : undefined), getUser: id => (id === friend.id ? friend : me) },
        MessageStore: { getMessage: (c, id) => messages.find(m => m.id === id), getMessages: () => ({ toArray: () => messages, ready: true, length: messages.length }) },
        // As on Discord: the store moves, the page doesn't.
        ChannelActions: { selectChannel: ({ channelId }) => { selected = channelId; }, selectVoiceChannel() {} },
        RelationshipStore: { getRelationshipType: () => 1, isFriend: () => true, getNickname: () => nickname },
        Gateway: { getSocket: () => socket, isTryingToConnect: () => true, isConnected: () => established },
        PresenceStore: { getStatus: () => "online", getActivities: () => [] },
        TypingStore: { getTypingUsers: () => ({}), isTyping: () => false },
        Sort: { getPrivateChannelIds: () => [channel.id] },
        // As on Discord: no count until a channel's messages are loaded, the marker apart from the newest id.
        Reads: { getUnreadCount: () => (nickname === "partly loaded" ? 1 : 0), getMentionCount: () => 0, hasUnread: () => true, ackMessageId: () => "400000000000000000", lastMessageId: () => "400000000000000001" },
        GuildChannels: { getChannels: () => ({ SELECTABLE: [{ channel: room }] }), getDefaultChannel: () => room },
        Emoji: { getGuildEmoji: () => [] },
        Folders: { getGuildFolders: () => [{ guildIds: [guild.id] }] },
        Flux: { dispatch() {}, subscribe(t, f) { (subs[t] ??= new Set()).add(f); }, unsubscribe(t, f) { subs[t]?.delete(f); } },
        Invites: {
            resolveInvite: async code => ({ invite: { code, guild: { id: "30000000000000000" + code.length, name: "Joined " + code }, channel: { id: "1", name: "x" } } }),
            acceptInvite: async ({ inviteKey }) => { const id = "30000000000000000" + inviteKey.length; memberOf[id] = { id, name: "Joined " + inviteKey }; report("join", { inviteKey }); },
        },
        Token: { getToken: () => "fake-token" },
        Mute: { isMuted: () => false, getMuteConfig: () => null },
        MuteAct: { updateGuildNotificationSettings: async () => {}, updateChannelOverrideSettings() {} },
        GuildAct: { leaveGuild: id => { delete memberOf[id]; report("leave", { id }); } },
        Super: { getSuperPropertiesBase64: () => "e30=" },
        Reactions: { a() { return '"MESSAGE_REACTION_ADD"'; }, b() { return '"MESSAGE_REACTION_REMOVE"'; } },
        // A module like the real ones that made Vencord's find give up.
        Touchy: Object.defineProperty({}, "boom", { enumerable: true, get() { throw new Error("don't read me"); } }),
        Proto: { ProtoClass: {}, updateAsync: async () => {}, type: 1 },
    };
    stores.Reactions.a = async (c, m, e) => { void '"MESSAGE_REACTION_ADD"'; report("react", { c, m, e }); };
    stores.Reactions.b = async () => { void '"MESSAGE_REACTION_REMOVE"'; };
    // Only the DM has a message list to show; the guild channel stands in for one that never renders.
    function go(path) {
        const id = path.split("/")[3];
        history.pushState({}, "", path);
        selected = id;
        setTimeout(() => {
            document.getElementById("app").innerHTML = id === channel.id ? `<div data-list-id="chat-messages"><div id="chat-messages-${channel.id}-${messages[0].id}">hello</div></div>` : "";
        }, 400);
    }
    const rest = async (method, path, q, init) => {
        if (path.endsWith("/auth/logout")) { report("logout"); return {}; }
        if (path.endsWith("/users/@me/channels")) { report("dm", JSON.parse(init.body)); return { id: channel.id, type: 1, recipients: [friend] }; }
        if (path.includes("/messages")) {
            const after = q.get("after");
            const more = (await (await fetch(rig + "/rig/history")).json()).map(m => msg(m.id, m.content));
            const all = [...messages, ...more.filter(m => !messages.some(x => x.id === m.id))];
            return after ? all.filter(m => BigInt(m.id) > BigInt(after)) : all;
        }
        return [];
    };
    window.FAKE = {
        common: {
            ChannelRouter: { transitionToChannel: id => go(`/channels/${channels[id]?.guild_id ?? "@me"}/${id}`) },
            NavigationRouter: { transitionTo: go },
        },
        mods: [...Object.values(stores), MessageActions],
        sources: { 1: () => "chat-messages messagesWrapper optionButtonWrapper" },
        CloudUpload: class {},
        rest,
    };
    if (loggedIn) setTimeout(() => emit("CONNECTION_OPEN"), 100);
    if (loggedIn) window.GLOBAL_ENV = { VERSION_HASH: new URLSearchParams(location.search).get("build") ?? "build1" };
    else setTimeout(() => { if (location.search.includes("autologin")) location.href = "/app"; }, 1500);
    // Messages the rig sends: what the gateway would do.
    (async function events() {
        for (;;) {
            try {
                const r = await fetch(rig + "/rig/next");
                const m = await r.json();
                if (m?.content) {
                    const full = msg(m.id, m.content);
                    messages.push(full);
                    for (const f of subs.MESSAGE_CREATE ?? []) f({ message: full });
                }
            } catch { await new Promise(r => setTimeout(r, 500)); }
        }
    })();
})();
</script>
