name = "harbor-accounts"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# GOOGLE_WEB_CLIENT_ID (Harbor's Google Cloud Web client id, for phones' own Google account picker,
# POST /v1/session/google) is a secret: `npx wrangler secret put GOOGLE_WEB_CLIENT_ID`. Never add
# it here as a var: a var of the same name blocks the secret (error 10053). Unset: picker off.
CLERK_FRONTEND_URL = "https://maximum-feline-2818.clerk.accounts.dev"
CLERK_API_URL = "https://api.clerk.com/v1"
HARBOR_KID = "k1"
APP_REDIRECT = "harbor://oauth"
TOKEN_DAYS = "7"
PUBLIC_URL = "https://harbor-accounts.rdevneo.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "harbor-accounts"
database_id = "e2c5b9ac-4f42-4d02-b694-459c666ab61f"
migrations_dir = "migrations"
