# whisper.cpp (whisper-rs-sys, voice input) reads GGML_*/WHISPER_* from the environment.
[env]
# A portable build: not tuned to the build machine's CPU (CI runners differ from users' PCs).
# x86_64 assumes AVX2/FMA/F16C (Haswell, 2013, and later); voice.rs checks that at run time
# and falls back to an external whisper-cli. These are ignored on aarch64.
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
# Use the crate's bundled bindings: no libclang needed to build.
WHISPER_DONT_GENERATE_BINDINGS = "1"
