# The built-in browser's Servo engines (desktop x86_64 and aarch64, the phone's), each compiled on
# its own boat.dev sandbox.
# Its id is the git tree hash of browser/, so it is rebuilt only when browser/ changes. Looked up
# in this order: the actions cache, then the latest release's harbor-browser-<arch>-linux.tar.gz,
# if the release key signed it. Servo is compiled only when neither has this id AND the caller
# asks for it:
#   - release.yml calls this with build=true on a v* tag (a release must ship the engine) and
#     build=false on runs by hand, which then just package no browser.
#   - Run it by hand (Actions > browser > Run workflow, on main) after changing browser/, so
#     the engine is cached on main and the next tag reuses it instead of compiling.
name: browser

on:
  workflow_dispatch:
    inputs:
      build:
        description: Compile Servo if no engine with this id is cached or released
        type: boolean
        default: true
      force:
        description: Compile even if an engine with this id is cached or released
        type: boolean
        default: false
  workflow_call:
    inputs:
      build:
        type: boolean
        default: false
    outputs:
      found:
        description: '"true" when the harbor-browser artifact (x86_64) was uploaded'
        value: ${{ jobs.engine.outputs.found }}
      found-aarch64:
        description: '"true" when the harbor-browser-aarch64 artifact was uploaded'
        value: ${{ jobs.engine-aarch64.outputs.found }}
      found-android:
        description: '"true" when the harbor-servo-android artifact (libharborservo.so, arm64-v8a) was uploaded'
        value: ${{ jobs.engine-android.outputs.found }}

permissions:
  contents: read
  actions: read

jobs:
  engine:
    # Servo's prebuilt SpiderMonkey wants a newer base, so the engine needs glibc 2.39+ (Ubuntu
    # 24.04, Debian 13, Arch, …) while Harbor itself runs on older systems (install.sh and Harbor
    # skip the engine there).
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      found: ${{ steps.done.outputs.found }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Engine id
        id: id
        run: echo "id=$(git rev-parse HEAD:browser)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: bin
        if: ${{ !inputs.force }}
        with:
          path: out/harbor-browser
          key: harbor-browser-bin-${{ steps.id.outputs.id }}
      - name: Reuse the latest release's engine
        id: prev
        if: steps.bin.outputs.cache-hit != 'true' && !inputs.force
        # Only an engine the release key signed: the asset itself could have been replaced.
        env:
          MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          mkdir -p out /tmp/prev
          curl -fsSL "$MINISIGN_URL" -o /tmp/minisign.tgz
          echo "$MINISIGN_SHA256  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp 2>/dev/null
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'harbor-browser-x86_64-linux.tar.gz*' --dir /tmp/prev 2>/dev/null \
             && tc="$(/tmp/minisign-linux/x86_64/minisign -VQm /tmp/prev/harbor-browser-x86_64-linux.tar.gz -p packaging/minisign.pub)" \
             && case "$tc" in "harbor v"*" harbor-browser-x86_64-linux.tar.gz") true ;; *) false ;; esac \
             && tar -xzf /tmp/prev/harbor-browser-x86_64-linux.tar.gz -C /tmp/prev \
             && [ "$(cat /tmp/prev/harbor-browser-x86_64-linux/browser.id)" = "${{ steps.id.outputs.id }}" ]; then
            cp /tmp/prev/harbor-browser-x86_64-linux/harbor-browser out/
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile?
        id: need
        if: steps.bin.outputs.cache-hit != 'true' && steps.prev.outputs.hit != 'true'
        run: |
          if [ "${{ inputs.build }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No prebuilt engine for browser/ ${{ steps.id.outputs.id }}; skipping the browser (run the browser workflow on main to build it)."
          fi
      # On a boat.dev sandbox (.github/boat/browser.sh), from the saved snapshot `harbor-browser`
      # that keeps Rust, the crates and target/ warm; a compile on main saves it, never one on a branch.
      - uses: ./.github/actions/boat
        id: boat
        if: steps.need.outputs.build == 'true'
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          from: harbor-browser
      - name: Build harbor-browser (on boat)
        if: steps.need.outputs.build == 'true'
        run: |
          set -eu
          .github/boat/run.sh "${{ steps.boat.outputs.id }}" --cwd src -- bash .github/boat/browser.sh
          mkdir -p out
          boat scp "${{ steps.boat.outputs.id }}:/home/user/out/harbor-browser/harbor-browser" out/harbor-browser
          chmod 755 out/harbor-browser
      - name: Save the boat cache
        if: steps.need.outputs.build == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          boat exec "${{ steps.boat.outputs.id }}" -- bash -c 'rm -rf src out'
          boat snapshot "${{ steps.boat.outputs.id }}" harbor-browser --json
      - name: Delete the sandbox
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/boat/cleanup.sh
      # Saved on main (a manual run) it is restorable by every later tag and main push.
      - uses: actions/cache/save@v6
        if: steps.need.outputs.build == 'true'
        continue-on-error: true
        with:
          path: out/harbor-browser
          key: harbor-browser-bin-${{ steps.id.outputs.id }}
      - name: Engine found
        id: done
        if: steps.bin.outputs.cache-hit == 'true' || steps.prev.outputs.hit == 'true' || steps.need.outputs.build == 'true'
        run: |
          ldd out/harbor-browser && echo "${{ steps.id.outputs.id }}" > out/browser.id
          echo "found=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.done.outputs.found == 'true'
        with:
          name: harbor-browser
          path: out/

  # The same for aarch64, cross-compiled on boat (mozjs has a prebuilt aarch64-unknown-linux-gnu
  # SpiderMonkey). A failure here never holds a release back: it just ships without an aarch64
  # engine, and aarch64 installs keep asking for one later.
  engine-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    outputs:
      found: ${{ steps.done.outputs.found }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Engine id
        id: id
        run: echo "id=$(git rev-parse HEAD:browser)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: bin
        if: ${{ !inputs.force }}
        with:
          path: out/harbor-browser
          key: harbor-browser-aarch64-bin-${{ steps.id.outputs.id }}
      - name: Reuse the latest release's engine
        id: prev
        if: steps.bin.outputs.cache-hit != 'true' && !inputs.force
        env:
          MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          mkdir -p out /tmp/prev
          curl -fsSL "$MINISIGN_URL" -o /tmp/minisign.tgz
          echo "$MINISIGN_SHA256  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp 2>/dev/null
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'harbor-browser-aarch64-linux.tar.gz*' --dir /tmp/prev 2>/dev/null \
             && tc="$(/tmp/minisign-linux/x86_64/minisign -VQm /tmp/prev/harbor-browser-aarch64-linux.tar.gz -p packaging/minisign.pub)" \
             && case "$tc" in "harbor v"*" harbor-browser-aarch64-linux.tar.gz") true ;; *) false ;; esac \
             && tar -xzf /tmp/prev/harbor-browser-aarch64-linux.tar.gz -C /tmp/prev \
             && [ "$(cat /tmp/prev/harbor-browser-aarch64-linux/browser.id)" = "${{ steps.id.outputs.id }}" ]; then
            cp /tmp/prev/harbor-browser-aarch64-linux/harbor-browser out/
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile?
        id: need
        if: steps.bin.outputs.cache-hit != 'true' && steps.prev.outputs.hit != 'true'
        run: |
          if [ "${{ inputs.build }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No prebuilt aarch64 engine for browser/ ${{ steps.id.outputs.id }}; skipping it (run the browser workflow on main to build it)."
          fi
      - uses: ./.github/actions/boat
        id: boat
        if: steps.need.outputs.build == 'true'
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          from: harbor-browser-aarch64
      - name: Build harbor-browser (on boat)
        if: steps.need.outputs.build == 'true'
        run: |
          set -eu
          .github/boat/run.sh "${{ steps.boat.outputs.id }}" --cwd src -- bash .github/boat/browser.sh aarch64
          mkdir -p out
          boat scp "${{ steps.boat.outputs.id }}:/home/user/out/harbor-browser/harbor-browser" out/harbor-browser
          chmod 755 out/harbor-browser
      - name: Save the boat cache
        if: steps.need.outputs.build == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          boat exec "${{ steps.boat.outputs.id }}" -- bash -c 'rm -rf src out'
          boat snapshot "${{ steps.boat.outputs.id }}" harbor-browser-aarch64 --json
      - name: Delete the sandbox
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/boat/cleanup.sh
      - uses: actions/cache/save@v6
        if: steps.need.outputs.build == 'true'
        continue-on-error: true
        with:
          path: out/harbor-browser
          key: harbor-browser-aarch64-bin-${{ steps.id.outputs.id }}
      - name: Engine found
        id: done
        if: steps.bin.outputs.cache-hit == 'true' || steps.prev.outputs.hit == 'true' || steps.need.outputs.build == 'true'
        run: |
          readelf -h out/harbor-browser | grep -q AArch64 && readelf -d out/harbor-browser | grep NEEDED
          echo "${{ steps.id.outputs.id }}" > out/browser.id
          echo "found=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.done.outputs.found == 'true'
        with:
          name: harbor-browser-aarch64
          path: out/

  # The phone app's engine: android/servo as libharborservo.so (+ the NDK's libc++_shared.so) for
  # arm64-v8a and armeabi-v7a (phones with a 32-bit Android, like the Galaxy A13), cross-compiled with
  # the NDK on boat (.github/boat/browser-android.sh). Its id is the tree hash of android/servo. Looked up like the desktop's: the
  # actions cache, then the latest release's APK (if its signature checks out and its
  # assets/servo.id matches). release.yml puts it into the APK before signing.
  engine-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      found: ${{ steps.done.outputs.found }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Engine id
        id: id
        run: echo "id=$(git rev-parse HEAD:android/servo)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: bin
        if: ${{ !inputs.force }}
        with:
          path: |
            out/arm64-v8a
            out/armeabi-v7a
          key: harbor-servo-android-2abi-${{ steps.id.outputs.id }}
      - name: Reuse the latest release's engine
        id: prev
        if: steps.bin.outputs.cache-hit != 'true' && !inputs.force
        env:
          MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          mkdir -p out/arm64-v8a out/armeabi-v7a /tmp/prev
          curl -fsSL "$MINISIGN_URL" -o /tmp/minisign.tgz
          echo "$MINISIGN_SHA256  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp 2>/dev/null
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'harbor-android.apk*' --dir /tmp/prev 2>/dev/null \
             && tc="$(/tmp/minisign-linux/x86_64/minisign -VQm /tmp/prev/harbor-android.apk -p packaging/minisign.pub)" \
             && case "$tc" in "harbor v"*" harbor-android.apk") true ;; *) false ;; esac \
             && [ "$(unzip -p /tmp/prev/harbor-android.apk assets/servo.id 2>/dev/null)" = "${{ steps.id.outputs.id }}" ] \
             && (for abi in arm64-v8a armeabi-v7a; do
                   for so in libharborservo.so libc++_shared.so; do
                     unzip -p /tmp/prev/harbor-android.apk "lib/$abi/$so" > "out/$abi/$so" && [ -s "out/$abi/$so" ] || exit 1
                   done
                 done); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            rm -f out/*/*.so
          fi
      - name: Compile?
        id: need
        if: steps.bin.outputs.cache-hit != 'true' && steps.prev.outputs.hit != 'true'
        run: |
          if [ "${{ inputs.build }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No prebuilt Android engine for android/servo ${{ steps.id.outputs.id }}; skipping it (run the browser workflow on main to build it)."
          fi
      # The snapshot `harbor-browser-android` keeps the NDK, Rust's Android targets, cargo-ndk and target/ warm.
      - uses: ./.github/actions/boat
        id: boat
        if: steps.need.outputs.build == 'true'
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          from: harbor-browser-android
      - name: Build libharborservo.so (on boat)
        if: steps.need.outputs.build == 'true'
        run: |
          set -eu
          .github/boat/run.sh "${{ steps.boat.outputs.id }}" --cwd src -- bash .github/boat/browser-android.sh
          boat exec "${{ steps.boat.outputs.id }}" -- tar -czf out.tgz -C out/android .
          boat scp "${{ steps.boat.outputs.id }}:/home/user/out.tgz" "$RUNNER_TEMP/out.tgz"
          mkdir -p out && tar -xzf "$RUNNER_TEMP/out.tgz" -C out
      - name: Save the boat cache
        if: steps.need.outputs.build == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          boat exec "${{ steps.boat.outputs.id }}" -- bash -c 'rm -rf src out out.tgz'
          boat snapshot "${{ steps.boat.outputs.id }}" harbor-browser-android --json
      - name: Delete the sandbox
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/boat/cleanup.sh
      - uses: actions/cache/save@v6
        if: steps.need.outputs.build == 'true'
        continue-on-error: true
        with:
          path: |
            out/arm64-v8a
            out/armeabi-v7a
          key: harbor-servo-android-2abi-${{ steps.id.outputs.id }}
      - name: Engine found
        id: done
        if: steps.bin.outputs.cache-hit == 'true' || steps.prev.outputs.hit == 'true' || steps.need.outputs.build == 'true'
        run: |
          ls -la out/arm64-v8a/libharborservo.so out/armeabi-v7a/libharborservo.so && echo "${{ steps.id.outputs.id }}" > out/servo.id
          echo "found=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.done.outputs.found == 'true'
        with:
          name: harbor-servo-android
          path: out/
