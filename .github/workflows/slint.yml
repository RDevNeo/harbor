# Harbor's Slint addon: slint-ui's native module with keep-compiler-state.patch (slint/build.sh), for
# x86_64 and aarch64, on a boat.dev sandbox. Its id is the git tree hash of slint/, so it is rebuilt
# only when slint/ changes. Looked up in this order: the actions cache, then the latest release's
# archives, if the release key signed them. Compiled only when neither has this id AND the caller
# asks for it:
#   - release.yml calls this with build=true on a v* tag and build=false on runs by hand.
#   - Run it by hand (Actions > slint > Run workflow, on main) after changing slint/, so the next
#     tag reuses it.
name: slint

on:
  workflow_dispatch:
    inputs:
      build:
        description: Compile if no addon with this id is cached or released
        type: boolean
        default: true
      force:
        description: Compile even if an addon with this id is cached or released
        type: boolean
        default: false
  workflow_call:
    inputs:
      build:
        type: boolean
        default: false
    outputs:
      found:
        description: '"true" when the harbor-slint artifact was uploaded'
        value: ${{ jobs.addon.outputs.found }}

permissions:
  contents: read
  actions: read

jobs:
  addon:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      found: ${{ steps.done.outputs.found }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Addon id
        id: id
        run: echo "id=$(git rev-parse HEAD:slint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: bin
        if: ${{ !inputs.force }}
        with:
          path: out/slint
          key: harbor-slint-bin-${{ steps.id.outputs.id }}
      - name: Reuse the latest release's addon
        id: prev
        if: steps.bin.outputs.cache-hit != 'true' && !inputs.force
        # Only one the release key signed: an asset itself could have been replaced.
        env:
          MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          mkdir -p out/slint/x86_64 out/slint/aarch64 /tmp/prev
          curl -fsSL "$MINISIGN_URL" -o /tmp/minisign.tgz
          echo "$MINISIGN_SHA256  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp 2>/dev/null
          ok=true
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'harbor-slint-*' --dir /tmp/prev 2>/dev/null || ok=false
          for f in harbor-slint-x86_64-linux harbor-slint-aarch64-linux harbor-slint-source; do
            [ "$ok" = true ] || break
            tc="$(/tmp/minisign-linux/x86_64/minisign -VQm "/tmp/prev/$f.tar.gz" -p packaging/minisign.pub)" || ok=false
            case "$tc" in "harbor v"*" $f.tar.gz") ;; *) ok=false ;; esac
          done
          if [ "$ok" = true ]; then
            tar -xzf /tmp/prev/harbor-slint-x86_64-linux.tar.gz -C /tmp/prev
            tar -xzf /tmp/prev/harbor-slint-aarch64-linux.tar.gz -C /tmp/prev
          fi
          if [ "$ok" = true ] && [ "$(cat /tmp/prev/harbor-slint-x86_64-linux/slint.id)" = "${{ steps.id.outputs.id }}" ]; then
            cp /tmp/prev/harbor-slint-x86_64-linux/slint-ui.linux-x64-gnu.node out/slint/x86_64/
            cp /tmp/prev/harbor-slint-aarch64-linux/slint-ui.linux-arm64-gnu.node out/slint/aarch64/
            cp -r /tmp/prev/harbor-slint-x86_64-linux/licenses out/slint/licenses
            cp /tmp/prev/harbor-slint-source.tar.gz out/slint/
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile?
        id: need
        if: steps.bin.outputs.cache-hit != 'true' && steps.prev.outputs.hit != 'true'
        run: |
          if [ "${{ inputs.build }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No prebuilt Slint addon for slint/ ${{ steps.id.outputs.id }}; skipping it (run the slint workflow on main to build it)"
          fi
      - uses: ./.github/actions/boat
        id: boat
        if: steps.need.outputs.build == 'true'
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          from: harbor-build
      - name: Build the addon (on boat)
        if: steps.need.outputs.build == 'true'
        run: |
          set -eu
          .github/boat/run.sh "${{ steps.boat.outputs.id }}" --cwd src -- bash .github/boat/slint.sh
          boat exec --timeout 600 "${{ steps.boat.outputs.id }}" -- tar -czf out.tgz -C out/slint .
          boat scp "${{ steps.boat.outputs.id }}:/home/user/out.tgz" "$RUNNER_TEMP/out.tgz"
          mkdir -p out/slint && tar -xzf "$RUNNER_TEMP/out.tgz" -C out/slint
      - name: Delete the sandbox
        if: always()
        run: .github/boat/cleanup.sh
      - uses: actions/cache/save@v6
        if: steps.need.outputs.build == 'true'
        continue-on-error: true
        with:
          path: out/slint
          key: harbor-slint-bin-${{ steps.id.outputs.id }}
      - name: Addon found
        id: done
        if: steps.bin.outputs.cache-hit == 'true' || steps.prev.outputs.hit == 'true' || steps.need.outputs.build == 'true'
        run: |
          ls -la out/slint out/slint/x86_64 out/slint/aarch64
          echo "${{ steps.id.outputs.id }}" > out/slint/slint.id
          echo "found=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.done.outputs.found == 'true'
        with:
          name: harbor-slint
          path: out/slint/
