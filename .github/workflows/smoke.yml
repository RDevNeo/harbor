# Installs Harbor with packaging/install.sh on clean distro images and starts it (see
# .github/smoke-install.sh): no sudo, every library found, the window comes up under Xvfb,
# --uninstall keeps the data folder; and the .deb packages (.github/smoke-deb.sh) on Debian and Ubuntu.
#   - release.yml calls it with this run's `dist` artifact, once per architecture: x86_64 before
#     anything is published, aarch64 beside the publishing (it takes minutes under qemu).
#   - Changing install.sh on a branch, or running it by hand, tests both against the latest release.
name: smoke

on:
  workflow_call:
    inputs:
      dist:
        description: Use this run's `dist` artifact instead of the latest release
        type: boolean
        default: false
      arch:
        description: Test only this architecture (x86_64 or aarch64) instead of both
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run:
        description: "Test this release.yml run's `dist` artifact (its run id; a dry run's) instead of the latest release"
        type: string
        default: ""
  push:
    branches-ignore: [main]
    paths: [packaging/install.sh, packaging/deb/**, .github/deb.sh, .github/smoke-deb.sh, .github/smoke-install.sh, .github/workflows/smoke.yml, .github/boat/smoke.sh, .github/boat/run.sh, .github/actions/boat/action.yml]

permissions:
  contents: read
  actions: read

jobs:
  # Every distro image asked for at once, as containers on one boat.dev sandbox (.github/boat/smoke.sh).
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: inputs.dist
        with:
          name: dist
          path: dist
      - name: Another run's release files
        if: ${{ !inputs.dist && inputs.run != '' && inputs.run != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run }}" --repo "$GITHUB_REPOSITORY" --name dist --dir dist
          ls -la dist
      - name: The latest release
        if: ${{ !inputs.dist && (inputs.run == '' || inputs.run == null) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'harbor-*-linux.tar.gz*' --pattern 'harbor-*-linux.deb' --pattern 'SHA256SUMS*' || true
          ls -la dist
      - uses: ./.github/actions/boat
        id: boat
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          label: ${{ inputs.arch }}
      - name: Install and start (on boat)
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -eu
          # Only what install.sh uses on these machines, as it is: it's all compressed already.
          skip=(--exclude='harbor-video-source*')
          case "$ARCH" in
            x86_64) skip+=(--exclude='*aarch64*') ;;
            aarch64) skip+=(--exclude='*x86_64*') ;;
          esac
          tar -cf "$RUNNER_TEMP/dist.tar" "${skip[@]}" dist
          id="${{ steps.boat.outputs.id }}"
          for try in 1 2 3; do
            boat scp "$RUNNER_TEMP/dist.tar" "$id:/home/user/dist.tar" && boat exec "$id" --timeout 300 -- tar -xf dist.tar && break
            [ "$try" != 3 ] || exit 1
            echo "::warning::copying the release files failed (try $try of 3)"; sleep 10
          done
          # RUN_RETRY: boat's own failures run the tests once more (smoke.sh also retries a distro
          # whose image docker couldn't get).
          RUN_RETRY=1 .github/boat/run.sh "$id" --cwd src -- env SMOKE_ARCH="$ARCH" bash .github/boat/smoke.sh
      - name: Delete the sandbox
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/boat/cleanup.sh
