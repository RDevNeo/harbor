# Installs Harbor with packaging/install.sh on clean distro images and starts it (see
# .github/smoke-install.sh): no sudo, every library found, the window comes up under Xvfb,
# --uninstall keeps the data folder.
#   - release.yml calls it with this run's `dist` artifact, before anything is published.
#   - Changing install.sh on a branch, or running it by hand, tests against the latest release.
name: smoke

on:
  workflow_call:
    inputs:
      dist:
        description: Use this run's `dist` artifact instead of the latest release
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [packaging/install.sh, .github/smoke-install.sh, .github/workflows/smoke.yml, .github/boat/smoke.sh]

permissions:
  contents: read

jobs:
  # Every distro image at once, as containers on one boat.dev sandbox (.github/boat/smoke.sh).
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: inputs.dist
        with:
          name: dist
          path: dist
      - name: The latest release
        if: ${{ !inputs.dist }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'harbor-*-linux.tar.gz*' --pattern 'SHA256SUMS*' || true
          rm -f dist/harbor-browser-*
          ls -la dist
      - uses: ./.github/actions/boat
        id: boat
        with:
          key: ${{ secrets.BOAT_API_KEY }}
      - name: Install and start (on boat)
        run: |
          set -eu
          tar -czf "$RUNNER_TEMP/dist.tgz" dist
          boat scp "$RUNNER_TEMP/dist.tgz" "${{ steps.boat.outputs.id }}:/home/user/dist.tgz"
          boat exec "${{ steps.boat.outputs.id }}" -- tar -xzf dist.tgz
          boat exec "${{ steps.boat.outputs.id }}" --cwd src --timeout 0 -- bash .github/boat/smoke.sh
      - name: Delete the sandbox
        if: always() && steps.boat.outputs.id != ''
        run: boat delete "${{ steps.boat.outputs.id }}" --yes --json
