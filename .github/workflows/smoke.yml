# Installs Harbor with packaging/install.sh on clean distro images and starts it (see
# .github/smoke-install.sh): no sudo, every library found, the window comes up under Xvfb,
# --uninstall keeps the data folder.
#   - release.yml calls it with this run's `dist` artifact, before anything is published.
#   - Changing install.sh on a branch, or running it by hand, tests against the latest release.
name: smoke

on:
  workflow_call:
    inputs:
      dist:
        description: Use this run's `dist` artifact instead of the latest release
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [packaging/install.sh, .github/smoke-install.sh, .github/workflows/smoke.yml]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", arch: x86_64, runner: ubuntu-24.04 }
          - { image: "debian:12", arch: x86_64, runner: ubuntu-24.04 }
          - { image: "fedora:latest", arch: x86_64, runner: ubuntu-24.04 }
          - { image: "archlinux:latest", arch: x86_64, runner: ubuntu-24.04 }
          - { image: "ubuntu:22.04", arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: "debian:12", arch: aarch64, runner: ubuntu-24.04-arm }
    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: inputs.dist
        with:
          name: dist
          path: dist
      - name: The latest release
        if: ${{ !inputs.dist }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'harbor-${{ matrix.arch }}-linux.tar.gz*' --pattern 'SHA256SUMS*' || true
      - name: Install and start
        run: |
          if [ ! -f dist/harbor-${{ matrix.arch }}-linux.tar.gz ]; then
            echo "::notice::no harbor-${{ matrix.arch }}-linux.tar.gz to test"; exit 0
          fi
          ls -la dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" "${{ matrix.image }}" sh /src/.github/smoke-install.sh
