# Builds Harbor for Linux x86_64 and aarch64 and publishes a GitHub Release on a v* tag, once
# smoke.yml has installed and started it on clean distro images. Every build and test runs on
# boat.dev sandboxes (.github/boat/); this runner only signs, attests and publishes.
#
# Assets: harbor-{x86_64,aarch64}-linux.tar.gz (harbor + desktop entry, icons, licences, install.sh), harbor-browser-x86_64-linux.tar.gz (optional Servo engine), install.sh,
# harbor-android.apk (the phone app), SHA256SUMS, and a minisign .minisig for each. Harbor's
# updater checks those signatures with the public key in src/update.rs.
#
# Secrets: MINISIGN_SECRET_KEY (unencrypted minisign secret key file contents);
# BOAT_API_KEY (a boat.dev API key that can create, use and delete sandboxes);
# ANDROID_KEYSTORE (base64 of the app's signing keystore), ANDROID_KEYSTORE_PASS,
# ANDROID_KEY_ALIAS. Every APK must be signed with that same key, or phones can't update.
name: release

# Pushes to main (each publish.sh) build everything except Servo (see browser.yml) but sign or
# release nothing. They exist to save the caches (the boat snapshot `harbor-build`; GitHub's caches
# for the browser engine: a tag run only restores caches saved on its own ref or on main).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One run per ref; a newer push to main waits instead of cancelling (cancelled runs save no cache).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73

jobs:
  # The snapshot `harbor-build` keeps Rust, the crates, both target/ folders and the Android SDK warm.
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - uses: ./.github/actions/boat
        id: boat
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          from: harbor-build
      - name: Build (on boat)
        run: .github/boat/run.sh "${{ steps.boat.outputs.id }}" --cwd src -- env HARBOR_GIT_SHA="$GITHUB_SHA" bash .github/boat/build.sh
      - name: Fetch the results
        run: |
          set -eu
          boat exec "${{ steps.boat.outputs.id }}" -- bash -c 'rm -f out/*.log && tar -czf out.tgz -C out .'
          boat scp "${{ steps.boat.outputs.id }}:/home/user/out.tgz" "$RUNNER_TEMP/out.tgz"
          mkdir -p out && tar -xzf "$RUNNER_TEMP/out.tgz" -C out
      - name: Save the cache
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          boat exec "${{ steps.boat.outputs.id }}" -- bash -c 'rm -rf src out out.tgz'
          boat snapshot "${{ steps.boat.outputs.id }}" harbor-build --json
      - name: Delete the sandbox
        if: always() && steps.boat.outputs.id != ''
        run: boat delete "${{ steps.boat.outputs.id }}" --yes --json
      # The oldest supported base, glibc 2.35+ (Ubuntu 22.04, Debian 12, Arch, …), as this runner.
      - run: ldd out/harbor-x86_64/harbor && out/harbor-x86_64/harbor --version
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-x86_64
          path: out/harbor-x86_64/harbor
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-aarch64
          path: out/harbor-aarch64/harbor
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-android-unsigned
          path: out/harbor-android/harbor-android-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-extra
          path: out/extra/

  # Never compiles Servo on a main push (no engine found = no browser in that run's package).
  # A tag compiles it only when browser/ changed and nobody ran the browser workflow on main.
  browser:
    uses: ./.github/workflows/browser.yml
    secrets: inherit
    with:
      build: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Only what needs the secrets or GitHub's OIDC, and plain file copies: signing the APK, the
  # archives and their checksum lists, and the attestations.
  package:
    needs: [build, browser]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: art
      # Main pushes without the signing secrets sign with a throwaway key, only to prove it signs.
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          umask 077
          ks="$RUNNER_TEMP/android.jks"
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$ks"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::ANDROID_KEYSTORE is not set"; exit 1
          else
            keytool -genkeypair -keystore "$ks" -storepass throwaway -alias harbor \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" >/dev/null 2>&1
            ANDROID_KEYSTORE_PASS=throwaway ANDROID_KEY_ALIAS=harbor
          fi
          export ANDROID_KEYSTORE_PASS
          bt="$ANDROID_HOME/build-tools/34.0.0"
          [ -x "$bt/apksigner" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
          mkdir -p art/harbor-android
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:ANDROID_KEYSTORE_PASS --ks-key-alias "${ANDROID_KEY_ALIAS:-harbor}" \
            --out art/harbor-android/harbor-android.apk art/harbor-android-unsigned/harbor-android-unsigned.apk
          rm -f "$ks" art/harbor-android/harbor-android.apk.idsig
          "$bt/apksigner" verify --print-certs art/harbor-android/harbor-android.apk | head -2
          "$bt/aapt2" dump badging art/harbor-android/harbor-android.apk | head -3
      - name: Assemble
        run: |
          set -eu
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist
          for arch in x86_64 aarch64; do
            d=pkg/harbor-$arch-linux
            mkdir -p "$d/licenses"
            install -m755 "art/harbor-$arch/harbor" "$d/harbor"
            # Harbor 0.17 and older refuse an update without harbor-stream (the screen viewer,
            # removed in 0.18): a placeholder keeps their in-app updates working.
            printf '#!/bin/sh\necho "harbor-stream was removed in Harbor 0.18" >&2\nexit 1\n' > "$d/harbor-stream"
            chmod 755 "$d/harbor-stream"
            install -m755 packaging/install.sh "$d/install.sh"
            cp packaging/harbor.desktop packaging/harbor.svg README.md CHANGELOG.md "$d/"
            cp art/harbor-extra/harbor-256.png "$d/harbor-256.png"
            echo "$ver" > "$d/VERSION"
            # The engine's id, also when this run has no engine (only main pushes; tags always do).
            git rev-parse HEAD:browser > "$d/browser.id"
            cp LICENSE "$d/licenses/Harbor-MIT.txt"
            cp assets/fonts/OFL.txt "$d/licenses/Geist-OFL-1.1.txt"
            cp assets/fonts/LUCIDE-LICENSE.txt "$d/licenses/Lucide-ISC.txt"
            cp assets/logos/LOBE-ICONS-LICENSE.txt assets/logos/SIMPLE-ICONS-LICENSE.md "$d/licenses/"
            cp packaging/speech-NOTICE.txt "$d/licenses/speech-NOTICE.txt"
            [ ! -f art/harbor-extra/lic/harbor.html ] || cp art/harbor-extra/lic/harbor.html "$d/licenses/third-party-harbor.html"
          done

          b=pkg/harbor-browser-x86_64-linux
          if [ "${{ needs.browser.outputs.found }}" = "true" ]; then
            mkdir -p "$b/licenses"
            install -m755 art/harbor-browser/harbor-browser "$b/harbor-browser"
            cp art/harbor-browser/browser.id "$b/browser.id"
            cp browser/LICENSE "$b/licenses/harbor-browser-MIT.txt"
            [ -f art/harbor-extra/lic/harbor-browser.html ] && cp art/harbor-extra/lic/harbor-browser.html "$b/licenses/third-party-harbor-browser.html"
            echo "harbor-browser is MIT; it links Servo (MPL-2.0), whose source is at https://github.com/servo/servo" > "$b/licenses/README.txt"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::a release needs the browser engine"; exit 1
          fi
          # A checksum list inside each archive: install.sh run from an extracted folder checks it offline.
          for x in pkg/*/; do
            (cd "$x" && find . -type f ! -name 'SHA256SUMS*' | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS)
          done
      - name: Get minisign
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL "$MINISIGN_URL" -o /tmp/minisign.tgz
          echo "$MINISIGN_SHA256  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp 2>/dev/null
      - name: Sign the checksum lists inside the archives
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for x in $(cd pkg && ls); do
            /tmp/minisign-linux/x86_64/minisign -S -s /tmp/minisign.key -m "pkg/$x/SHA256SUMS" -t "harbor $GITHUB_REF_NAME $x/SHA256SUMS"
          done
          rm -f /tmp/minisign.key
      - name: Pack
        run: |
          set -eu
          tar -C pkg -czf dist/harbor-x86_64-linux.tar.gz harbor-x86_64-linux
          tar -C pkg -czf dist/harbor-aarch64-linux.tar.gz harbor-aarch64-linux
          [ ! -d pkg/harbor-browser-x86_64-linux ] || tar -C pkg -czf dist/harbor-browser-x86_64-linux.tar.gz harbor-browser-x86_64-linux
          cp packaging/install.sh dist/install.sh
          cp art/harbor-android/harbor-android.apk dist/harbor-android.apk
          (cd dist && sha256sum *.tar.gz install.sh harbor-android.apk > SHA256SUMS)
          ls -la dist
          tar -tzf dist/harbor-x86_64-linux.tar.gz | grep SHA256SUMS
      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for f in dist/*.tar.gz dist/install.sh dist/harbor-android.apk dist/SHA256SUMS; do
            /tmp/minisign-linux/x86_64/minisign -S -s /tmp/minisign.key -m "$f" -t "harbor $GITHUB_REF_NAME $(basename "$f")"
          done
          rm -f /tmp/minisign.key
          /tmp/minisign-linux/x86_64/minisign -Vm dist/harbor-x86_64-linux.tar.gz -p packaging/minisign.pub
          /tmp/minisign-linux/x86_64/minisign -Vm dist/harbor-aarch64-linux.tar.gz -p packaging/minisign.pub
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            dist/harbor-x86_64-linux.tar.gz
            dist/harbor-aarch64-linux.tar.gz
            dist/harbor-browser-x86_64-linux.tar.gz
            dist/install.sh
            dist/harbor-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    needs: package
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
    with:
      dist: true

  publish:
    needs: [package, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section, then GitHub's generated notes.
          awk -v v="$ver" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          printf '\n**Install:** `curl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh`\n' "$GITHUB_REPOSITORY" >> notes.md
          printf '\n**Android:** download `harbor-android.apk` below, or scan the install QR code in Harbor › Settings › Phones.\n' >> notes.md
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Harbor $ver" --notes-file notes.md --generate-notes $pre
