# Builds Harbor for Linux x86_64 and aarch64 and publishes a GitHub Release on a v* tag, once
# smoke.yml has installed and started it on clean x86_64 distro images; aarch64's, slow under qemu,
# run beside the publishing, and a failure there fails this run. Every build and test runs on
# boat.dev sandboxes (.github/boat/); this runner only signs, attests and publishes. Two exceptions:
# a bundle-only release (plan's where=runner) builds on the runner itself (.github/runner/build.sh,
# jobs quick and quick-aarch64) and publishes from package: seconds of `bun build` don't wait a
# minute and more for a sandbox. And the phone app always builds and is signed on the runner
# (.github/runner/android.sh, job android): on a sandbox it mostly waited for the lazy disk.
#
# Harbor is TypeScript on Bun (ts/); build.sh compiles it into one executable per architecture.
#
# Assets: harbor-{x86_64,aarch64}-linux.tar.gz (harbor + desktop entry, icons, licences, install.sh), harbor-video-{x86_64,aarch64}-linux.tar.gz (the video player) with harbor-video-source.tar.gz (its sources, which its licence asks for), harbor-slint-{x86_64,aarch64}-linux.tar.gz (Harbor's Slint addon, built into harbor; kept for the next release to reuse) with harbor-slint-source.tar.gz (its sources, which its licence asks for), install.sh,
# harbor-android.apk (the phone app), what an installed Harbor updates from (harbor-app.json, the
# manifest; harbor-app.js, the app bundle; harbor-runtime-{x86_64,aarch64} when the runtime changed),
# SHA256SUMS, and a minisign .minisig for each. Harbor's updater checks those signatures with the
# public key in ts/packages/update/src/minisign.ts (packaging/minisign.pub).
#
# Secrets: MINISIGN_SECRET_KEY (unencrypted minisign secret key file contents);
# BOAT_API_KEY (a boat.dev API key that can create, use and delete sandboxes);
# ANDROID_KEYSTORE (base64 of the app's signing keystore), ANDROID_KEYSTORE_PASS,
# ANDROID_KEY_ALIAS. Every APK must be signed with that same key, or phones can't update.
# GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET (optional): Harbor's Google OAuth Desktop client,
# compiled into the desktop builds for the Gmail app's one-click sign-in. HARBOR_GOOGLE_WEB_CLIENT_SECRET
# (optional): the secret of the Web client (HARBOR_GOOGLE_WEB_CLIENT_ID), so a PC can take the
# one-time code a phone gets from Android's account sheet for Gmail.
name: release

# A release is a v* tag: one run, one sandbox per target, of which x86_64's also saves the boat
# snapshot `harbor-build` for the next one. A push to main builds nothing (scripts/boat/check tests a change before it lands).
# Run by hand on main it builds everything, signs and releases nothing and saves the snapshot: a dry
# run of the pipeline.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      apk:
        description: "Phone app: build (always; saves its download cache for tags) or auto (as a tag: the latest release's APK again when nothing in it changed)"
        type: choice
        options: [build, auto]
        default: build

# One run per ref; a newer run waits instead of cancelling (cancelled runs save no cache).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

env:
  HARBOR_WORKER: ${{ vars.HARBOR_WORKER_URL || 'https://harbor-accounts.rdevneo.workers.dev' }}
  MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73

jobs:
  # The version, and what installed Harbors update from: the bundle alone when the runtime (Bun,
  # the native packages, the updater) didn't change since the latest release, both otherwise
  # (ts/scripts/release.ts: plain file reading, nothing installed or built). The manifest also
  # names the video player and phone app of this release.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      lane: ${{ steps.plan.outputs.lane }}
      min: ${{ steps.plan.outputs.min }}
      apk: ${{ steps.plan.outputs.apk }}
      previous: ${{ steps.plan.outputs.previous }}
      where: ${{ steps.plan.outputs.where }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches ts/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(jq -r .version ts/package.json)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but ts/package.json says $v"; exit 1; }
      - id: bun
        run: echo "version=$(jq -r '.packageManager | sub("bun@"; "")' ts/package.json)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Plan the update (lane and harbor-app.json)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver=$(jq -r .version ts/package.json)
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          mkdir -p prev manifest
          prev=""
          if [ -n "$tag" ] && gh release download "$tag" -p harbor-app.json -D prev 2>/dev/null; then
            lane=$(bun ts/scripts/release.ts lane --base "$tag" | sed -n 's/^lane=//p')
            prev="--previous prev/harbor-app.json"
          else
            lane=runtime
          fi
          # The phone app is rebuilt only when what goes into the APK changed since the latest
          # release: android/ and the fonts and logos android/build.sh
          # copies in. The desktop runtime isn't in it, so the lane doesn't matter. Otherwise that
          # release's signed APK is attached again and the manifest keeps naming it (apk {code,
          # release} carried over), so phones don't download and install the same app again. A run
          # by hand builds it (input apk=build, the default: the dry run tries the job, and its
          # download cache saved on main is the one tags can restore); apk=auto plans as a tag does.
          apk=build apkcode=()
          auto=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ "${{ inputs.apk }}" = auto ]; then auto=true; fi
          if [ "$auto" = true ] && [ -n "$prev" ] && jq -e '.apk.code' prev/harbor-app.json >/dev/null \
            && git diff --quiet "$tag" HEAD -- android/ assets/fonts/ assets/logos/; then
            apk=keep
          else
            IFS=.- read -r ma mi pa _ <<< "$ver"
            apkcode=(--apk-code $((ma * 1000000 + mi * 1000 + pa)))
          fi
          # Where the desktop builds run: a bundle-only release has nothing to build for the PCs but
          # JavaScript, so a tag builds it on the runner (jobs quick, quick-aarch64); a new runtime, and
          # runs by hand (the pipeline's dry run, which also saves the snapshot), on boat. The phone
          # app always builds on the runner (job android).
          where=boat
          if [ "$lane" = bundle ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then where=runner; fi
          bun ts/scripts/release.ts manifest --version "$ver" --lane "$lane" --out manifest/harbor-app.json $prev \
            --video-id "$(git rev-parse HEAD:video)" "${apkcode[@]}"
          cat manifest/harbor-app.json
          echo "phone app: $apk (latest release $tag)"
          { echo "version=$ver"; echo "lane=$lane"; echo "min=$(jq -r .minRuntime manifest/harbor-app.json)"
            echo "apk=$apk"; echo "previous=$tag"; echo "where=$where"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-manifest
          path: manifest/harbor-app.json

  # The snapshot `harbor-build` keeps Bun, its package cache and the Android SDK warm.
  build:
    if: needs.plan.outputs.where == 'boat'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [plan, slint]
    outputs:
      sandbox: ${{ steps.boat.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/boat
        id: boat
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          from: harbor-build
      - uses: ./.github/actions/slint-addon
        with:
          found: ${{ needs.slint.outputs.found }}
          sandbox: ${{ steps.boat.outputs.id }}
      - name: Build (on boat)
        # Harbor's Google OAuth clients: the Desktop one for the Gmail app's one-click sign-in and the
        # Web one phones get Gmail codes for, baked into the app (scripts/build.ts); the Web client id
        # is also the phone's own Google account picker (the APK). Repository secrets, not
        # variables: GitHub prints a step's env in its log, masking only secrets. Missing (forks):
        # each user brings their own client, and the picker is off.
        env:
          HARBOR_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          HARBOR_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_SECRET }}
        run: RUN_RETRY=1 .github/boat/run.sh "${{ steps.boat.outputs.id }}" --cwd src -- env HARBOR_GIT_SHA="$GITHUB_SHA" HARBOR_VERSION="${{ needs.plan.outputs.version }}" HARBOR_MIN_RUNTIME="${{ needs.plan.outputs.min }}" HARBOR_GOOGLE_WEB_CLIENT_ID="$HARBOR_GOOGLE_WEB_CLIENT_ID" HARBOR_GOOGLE_CLIENT_ID="$HARBOR_GOOGLE_CLIENT_ID" HARBOR_GOOGLE_CLIENT_SECRET="$HARBOR_GOOGLE_CLIENT_SECRET" HARBOR_GOOGLE_WEB_CLIENT_SECRET="$HARBOR_GOOGLE_WEB_CLIENT_SECRET" bash .github/boat/build.sh x86_64 licences macos
      - name: Fetch the results
        run: |
          set -eu
          boat exec --timeout 600 "${{ steps.boat.outputs.id }}" -- bash -c 'rm -f out/*.log && tar -czf out.tgz -C out .'
          for try in 1 2 3; do
            boat scp "${{ steps.boat.outputs.id }}:/home/user/out.tgz" "$RUNNER_TEMP/out.tgz" && break
            [ "$try" != 3 ] || exit 1
            echo "::warning::fetching the results failed (try $try of 3)"; sleep 10
          done
          mkdir -p out && tar -xzf "$RUNNER_TEMP/out.tgz" -C out
      # The oldest supported base, glibc 2.35+ (Ubuntu 22.04, Debian 12, Arch, …), as this runner.
      - run: ldd out/harbor-x86_64/harbor && out/harbor-x86_64/harbor --version
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-x86_64
          path: out/harbor-x86_64/
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-extra
          path: out/extra/
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-macos
          path: out/harbor-macos/

  # aarch64 on a sandbox of its own, from the same snapshot, which it doesn't save: Bun builds it
  # under qemu (build.sh), which would slow x86_64's build beside it.
  build-aarch64:
    needs: [plan, slint]
    if: needs.plan.outputs.where == 'boat'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/boat
        id: boat
        with:
          key: ${{ secrets.BOAT_API_KEY }}
          from: harbor-build
      - uses: ./.github/actions/slint-addon
        with:
          found: ${{ needs.slint.outputs.found }}
          sandbox: ${{ steps.boat.outputs.id }}
      - name: Build (on boat)
        env:
          HARBOR_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          HARBOR_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_SECRET }}
        run: RUN_RETRY=1 .github/boat/run.sh "${{ steps.boat.outputs.id }}" --cwd src -- env HARBOR_GIT_SHA="$GITHUB_SHA" HARBOR_VERSION="${{ needs.plan.outputs.version }}" HARBOR_MIN_RUNTIME="${{ needs.plan.outputs.min }}" HARBOR_GOOGLE_WEB_CLIENT_ID="$HARBOR_GOOGLE_WEB_CLIENT_ID" HARBOR_GOOGLE_CLIENT_ID="$HARBOR_GOOGLE_CLIENT_ID" HARBOR_GOOGLE_CLIENT_SECRET="$HARBOR_GOOGLE_CLIENT_SECRET" HARBOR_GOOGLE_WEB_CLIENT_SECRET="$HARBOR_GOOGLE_WEB_CLIENT_SECRET" bash .github/boat/build.sh aarch64
      - name: Fetch the results
        run: |
          set -eu
          boat exec --timeout 600 "${{ steps.boat.outputs.id }}" -- bash -c 'rm -f out/*.log && tar -czf out.tgz -C out .'
          for try in 1 2 3; do
            boat scp "${{ steps.boat.outputs.id }}:/home/user/out.tgz" "$RUNNER_TEMP/out.tgz" && break
            [ "$try" != 3 ] || exit 1
            echo "::warning::fetching the results failed (try $try of 3)"; sleep 10
          done
          mkdir -p out && tar -xzf "$RUNNER_TEMP/out.tgz" -C out
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-aarch64
          path: out/harbor-aarch64/
      - name: Delete the sandbox
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/boat/cleanup.sh

  # A bundle-only release that keeps the phone app (plan's where=runner): the same artifacts as build
  # and build-aarch64 (harbor-x86_64 with the app bundle, harbor-extra, harbor-aarch64), built here
  # on GitHub's runners, aarch64 on an arm64 one, by .github/runner/build.sh.
  quick:
    needs: [plan, slint]
    if: needs.plan.outputs.where == 'runner'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.slint.outputs.found == 'true'
        with:
          name: harbor-slint
          path: slint/out
      - name: Build (on this runner)
        env:
          HARBOR_VERSION: ${{ needs.plan.outputs.version }}
          HARBOR_MIN_RUNTIME: ${{ needs.plan.outputs.min }}
          HARBOR_GIT_SHA: ${{ github.sha }}
          HARBOR_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          HARBOR_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_SECRET }}
        run: .github/runner/build.sh x86_64 out && .github/runner/build.sh macos out
      - run: ldd out/harbor-x86_64/harbor
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-x86_64
          path: out/harbor-x86_64/
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-extra
          path: out/extra/
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-macos
          path: out/harbor-macos/

  quick-aarch64:
    needs: [plan, slint]
    if: needs.plan.outputs.where == 'runner'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.slint.outputs.found == 'true'
        with:
          name: harbor-slint
          path: slint/out
      - name: Build (on this runner)
        env:
          HARBOR_VERSION: ${{ needs.plan.outputs.version }}
          HARBOR_MIN_RUNTIME: ${{ needs.plan.outputs.min }}
          HARBOR_GIT_SHA: ${{ github.sha }}
          HARBOR_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          HARBOR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          HARBOR_GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_SECRET }}
        run: .github/runner/build.sh aarch64 out
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-aarch64
          path: out/harbor-aarch64/

  # The phone app, when plan says it changed, on the runner beside the desktop builds
  # (.github/runner/android.sh), signed here, so package only attaches it.
  android:
    needs: [plan]
    if: needs.plan.outputs.apk == 'build'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # android/build.sh's downloads, keyed by the SHA-256s it pins them by. A tag can only restore
      # what a run on main saved (the dry run), or the same tag's.
      - name: Download key
        id: deps
        run: echo "key=harbor-android-deps-$(grep -oE '\b[0-9a-f]{64}\b' android/build.sh | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/harbor-android-deps
          key: ${{ steps.deps.outputs.key }}
      - name: Build the APK (on this runner)
        env:
          HARBOR_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HARBOR_GOOGLE_WEB_CLIENT_ID }}
        run: .github/runner/android.sh out/harbor-android-unsigned.apk
      # Runs by hand without the signing secrets sign with a throwaway key, only to prove it signs.
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          umask 077
          ks="$RUNNER_TEMP/android.jks"
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$ks"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::ANDROID_KEYSTORE is not set"; exit 1
          else
            keytool -genkeypair -keystore "$ks" -storepass throwaway -alias harbor \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" >/dev/null 2>&1
            ANDROID_KEYSTORE_PASS=throwaway ANDROID_KEY_ALIAS=harbor
          fi
          export ANDROID_KEYSTORE_PASS
          bt="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p out/harbor-android
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:ANDROID_KEYSTORE_PASS --ks-key-alias "${ANDROID_KEY_ALIAS:-harbor}" \
            --out out/harbor-android/harbor-android.apk out/harbor-android-unsigned.apk
          rm -f "$ks" out/harbor-android/harbor-android.apk.idsig
          "$bt/apksigner" verify --print-certs out/harbor-android/harbor-android.apk | head -2
          "$bt/aapt2" dump badging out/harbor-android/harbor-android.apk | head -3
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-android
          path: out/harbor-android/harbor-android.apk
          compression-level: 0

  # Saves the snapshot and deletes the build's sandbox, beside the packaging: a release doesn't wait
  # for it, and it never fails one. Runs also when the build failed: then it only deletes.
  cache:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
      BOAT_SANDBOX: ci-harbor-${{ github.run_id }}-${{ github.run_attempt }}-build
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: .github/boat/cli.sh
      - name: Save the snapshot
        if: needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        run: |
          id="${{ needs.build.outputs.sandbox }}"
          .github/boat/run.sh "$id" --cwd src -- bash .github/boat/warm.sh
          boat exec "$id" -- bash -c 'rm -rf src out out.tgz'
          boat snapshot "$id" harbor-build --json
      - name: Delete the sandbox
        if: always()
        run: .github/boat/cleanup.sh

  # The video player, rebuilt only when video/ changed (video.yml).
  video:
    uses: ./.github/workflows/video.yml
    secrets: inherit
    with:
      build: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Harbor's Slint addon, rebuilt only when slint/ changed (slint.yml); the builds wait for it.
  slint:
    uses: ./.github/workflows/slint.yml
    secrets: inherit
    with:
      build: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Only what needs the secrets or GitHub's OIDC, and plain file copies: signing the archives and
  # their checksum lists, and the attestations (job android signs the APK).
  package:
    needs: [plan, build, build-aarch64, quick, quick-aarch64, android, video, slint]
    # One pair of desktop builds runs (plan's where), the other is skipped; android only with a new APK.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: art
      # The phone app didn't change since the latest release (plan): that release's signed APK again.
      - name: The latest release's APK
        if: needs.plan.outputs.apk == 'keep'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p art/harbor-android
          gh release download "${{ needs.plan.outputs.previous }}" -p harbor-android.apk -D art/harbor-android
          # The manifest names this app (apk.code, carried over by plan): the file must be that one.
          want=$(jq -r '.apk.code' art/harbor-manifest/harbor-app.json)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          got=$("$aapt2" dump badging art/harbor-android/harbor-android.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          echo "attached again: versionCode $got, manifest apk $(jq -c .apk art/harbor-manifest/harbor-app.json)"
          [ "$got" = "$want" ] || { echo "::error::the latest release's APK is versionCode $got, the manifest names $want"; exit 1; }
      # A bundle-only release: the runtime PCs have now must load the new bundle (the build already
      # checked it on the new runtime).
      - name: The bundle starts on the runtime PCs have now
        if: needs.plan.outputs.lane == 'bundle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rt=$(jq -r .runtime art/harbor-manifest/harbor-app.json)
          gh release download "v$rt" -p harbor-runtime-x86_64 -D /tmp/rt
          chmod +x /tmp/rt/harbor-runtime-x86_64
          # An absolute path: the runtime resolves a relative one inside its own embedded files.
          said=$(/tmp/rt/harbor-runtime-x86_64 smoke-bundle "$PWD/art/harbor-x86_64/harbor-app.js")
          [ "$said" = "harbor ${{ needs.plan.outputs.version }}" ] || { echo "::error::the bundle on runtime $rt says: $said"; exit 1; }
      - name: Assemble
        run: |
          set -eu
          ver="${{ needs.plan.outputs.version }}"
          mkdir -p dist
          for arch in x86_64 aarch64; do
            d=pkg/harbor-$arch-linux
            mkdir -p "$d/licenses"
            install -m755 "art/harbor-$arch/harbor" "$d/harbor"
            # Harbor 0.17 and older refuse an update without harbor-stream (the screen viewer,
            # removed in 0.18): a placeholder keeps their in-app updates working.
            printf '#!/bin/sh\necho "harbor-stream was removed in Harbor 0.18" >&2\nexit 1\n' > "$d/harbor-stream"
            chmod 755 "$d/harbor-stream"
            install -m755 packaging/install.sh "$d/install.sh"
            cp packaging/harbor.desktop packaging/harbor.svg README.md CHANGELOG.md "$d/"
            cp art/harbor-extra/harbor-256.png "$d/harbor-256.png"
            echo "$ver" > "$d/VERSION"
            git rev-parse HEAD:video > "$d/video.id"
            cp LICENSE "$d/licenses/Harbor-MIT.txt"
            cp assets/fonts/OFL.txt "$d/licenses/Geist-OFL-1.1.txt"
            cp assets/fonts/LUCIDE-LICENSE.txt "$d/licenses/Lucide-ISC.txt"
            cp assets/logos/LOBE-ICONS-LICENSE.txt assets/logos/SIMPLE-ICONS-LICENSE.md "$d/licenses/"
            cp packaging/speech-NOTICE.txt "$d/licenses/speech-NOTICE.txt"
            # Harbor's Slint addon is built into harbor: Slint's licences and where its source is.
            [ "${{ needs.slint.outputs.found }}" != "true" ] || { mkdir -p "$d/licenses/slint" && cp -r art/harbor-slint/licenses/. "$d/licenses/slint/"; }
            [ ! -f art/harbor-extra/lic/third-party-harbor.txt ] || cp art/harbor-extra/lic/third-party-harbor.txt "$d/licenses/third-party-harbor.txt"
          done

          # macOS (Apple Silicon): Harbor.app with the same licences, packed below; its runtime with
          # Linux's when the runtime changed. Artifacts lose file modes: the executables get theirs back.
          if [ -d art/harbor-macos/Harbor.app ]; then
            m=pkg-macos/Harbor.app
            mkdir -p pkg-macos
            cp -r art/harbor-macos/Harbor.app pkg-macos/
            chmod 755 "$m/Contents/MacOS/harbor"
            mkdir -p "$m/Contents/Resources/licenses"
            cp -r pkg/harbor-x86_64-linux/licenses/. "$m/Contents/Resources/licenses/"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::a release needs the macOS build"; exit 1
          fi

          # What installed Harbors update from (plan): the manifest and bundle always, the runtimes
          # when the lane says the runtime changed.
          cp art/harbor-manifest/harbor-app.json art/harbor-x86_64/harbor-app.js dist/
          if [ "${{ needs.plan.outputs.lane }}" = runtime ]; then
            for arch in x86_64 aarch64; do install -m755 "art/harbor-$arch/harbor-runtime-$arch" "dist/harbor-runtime-$arch"; done
            [ ! -f art/harbor-macos/harbor-runtime-aarch64-macos ] || install -m755 art/harbor-macos/harbor-runtime-aarch64-macos dist/harbor-runtime-aarch64-macos
          fi

          # The video player per arch, and its sources beside it, as its licence asks.
          if [ "${{ needs.video.outputs.found }}" = "true" ]; then
            for arch in x86_64 aarch64; do
              v=pkg/harbor-video-$arch-linux
              mkdir -p "$v"
              install -m755 "art/harbor-video/$arch/libmpv-harbor.so" "$v/libmpv-harbor.so"
              cp art/harbor-video/video.id "$v/video.id"
              cp -r art/harbor-video/licenses "$v/licenses"
              cp packaging/nv-codec-headers-NOTICE.txt "$v/licenses/"
            done
            cp art/harbor-video/harbor-video-source.tar.gz dist/
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::a release needs the video player"; exit 1
          else
            echo "::warning::no video player in this package"
          fi
          # Harbor's Slint addon per arch, for the next release to reuse (slint.yml), and its sources
          # beside it, as its licence asks.
          if [ "${{ needs.slint.outputs.found }}" = "true" ]; then
            for arch in x86_64 aarch64; do
              n=x64; [ "$arch" = x86_64 ] || n=arm64
              v=pkg/harbor-slint-$arch-linux
              mkdir -p "$v"
              install -m644 "art/harbor-slint/$arch/slint-ui.linux-$n-gnu.node" "$v/slint-ui.linux-$n-gnu.node"
              cp art/harbor-slint/slint.id "$v/slint.id"
              cp -r art/harbor-slint/licenses "$v/licenses"
            done
            cp art/harbor-slint/harbor-slint-source.tar.gz dist/
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::a release needs Harbor's Slint addon"; exit 1
          fi
          # A checksum list inside each archive: install.sh run from an extracted folder checks it offline.
          for x in pkg/*/; do
            (cd "$x" && find . -type f ! -name 'SHA256SUMS*' | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS)
          done
      - name: Get minisign
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL "$MINISIGN_URL" -o /tmp/minisign.tgz
          echo "$MINISIGN_SHA256  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp 2>/dev/null
      - name: Sign the checksum lists inside the archives
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for x in $(cd pkg && ls); do
            /tmp/minisign-linux/x86_64/minisign -S -s /tmp/minisign.key -m "pkg/$x/SHA256SUMS" -t "harbor $GITHUB_REF_NAME $x/SHA256SUMS"
          done
          rm -f /tmp/minisign.key
      - name: Pack
        run: |
          set -eu
          z=$(command -v pigz || echo gzip)
          tar -C pkg -I "$z" -cf dist/harbor-x86_64-linux.tar.gz harbor-x86_64-linux
          tar -C pkg -I "$z" -cf dist/harbor-aarch64-linux.tar.gz harbor-aarch64-linux
          [ ! -d pkg-macos/Harbor.app ] || tar -C pkg-macos -I "$z" -cf dist/harbor-aarch64-macos.tar.gz Harbor.app
          # macOS's disk image: Harbor.app beside a link to Applications, drag to install. An ISO 9660
          # file system with Rock Ridge (modes and the link kept, as Bitcoin Core's images do), made a
          # compressed disk image (UDZO) by .github/udzo.py.
          if [ -d pkg-macos/Harbor.app ]; then
            sudo apt-get install -y --no-install-recommends xorriso >/dev/null
            mkdir -p dmg-root
            cp -a pkg-macos/Harbor.app dmg-root/
            ln -s /Applications dmg-root/Applications
            xorrisofs -D -l -V Harbor -no-pad -r -dir-mode 0755 -o "$RUNNER_TEMP/harbor.iso" dmg-root
            python3 .github/udzo.py "$RUNNER_TEMP/harbor.iso" dist/harbor-aarch64-macos.dmg
          fi
          for arch in x86_64 aarch64; do
            [ ! -d pkg/harbor-video-$arch-linux ] || tar -C pkg -I "$z" -cf dist/harbor-video-$arch-linux.tar.gz harbor-video-$arch-linux
            [ ! -d pkg/harbor-slint-$arch-linux ] || tar -C pkg -I "$z" -cf dist/harbor-slint-$arch-linux.tar.gz harbor-slint-$arch-linux
          done
          cp packaging/install.sh dist/install.sh
          cp art/harbor-android/harbor-android.apk dist/harbor-android.apk
          (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS)
          ls -la dist
          tar -tzf dist/harbor-x86_64-linux.tar.gz | grep SHA256SUMS
      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for f in dist/*.tar.gz dist/*.dmg dist/install.sh dist/harbor-android.apk dist/harbor-app.json dist/harbor-app.js dist/harbor-runtime-* dist/SHA256SUMS; do
            [ -f "$f" ] || continue
            /tmp/minisign-linux/x86_64/minisign -S -s /tmp/minisign.key -m "$f" -t "harbor $GITHUB_REF_NAME $(basename "$f")"
          done
          rm -f /tmp/minisign.key
          /tmp/minisign-linux/x86_64/minisign -Vm dist/harbor-x86_64-linux.tar.gz -p packaging/minisign.pub
          /tmp/minisign-linux/x86_64/minisign -Vm dist/harbor-aarch64-linux.tar.gz -p packaging/minisign.pub
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/install.sh
            dist/harbor-android.apk
            dist/harbor-app.js
            dist/harbor-app.json
            dist/harbor-runtime-*
      # A bundle-only release has no install tests to wait for (smoke): it goes out from here, without
      # handing dist to another job.
      - name: Publish the release
        if: needs.plan.outputs.lane == 'bundle' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          compression-level: 0
      # The disk image alone too, for checking a dry run's on a Mac without fetching every file.
      - uses: actions/upload-artifact@v7
        if: hashFiles('dist/harbor-aarch64-macos.dmg') != ''
        with:
          name: harbor-dmg
          path: dist/harbor-aarch64-macos.dmg
          compression-level: 0

  # The install tests run when the runtime or the packaging changed (the runtime lane: packaging/
  # counts as runtime, ts/packages/update/src/lane.ts). A bundle-only release changes neither, and
  # package checks its bundle on the runtime PCs have.
  smoke:
    needs: [plan, package]
    if: needs.plan.outputs.lane == 'runtime'
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
    with:
      dist: true
      arch: x86_64

  # Holds nothing back: publish doesn't need it. A failure shows as this run's failure, after the
  # release is out.
  smoke-aarch64:
    needs: [plan, package]
    if: needs.plan.outputs.lane == 'runtime'
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
    with:
      dist: true
      arch: aarch64

  # A runtime release, once smoke passed (a bundle-only one is published by package).
  publish:
    needs: [plan, package, smoke]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') && needs.plan.outputs.lane == 'runtime' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/publish.sh
