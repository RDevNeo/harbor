# Builds Harbor for Linux x86_64 and publishes a GitHub Release on a v* tag.
#
# Assets: harbor-x86_64-linux.tar.gz (harbor + desktop entry, icons, licences, install.sh), harbor-browser-x86_64-linux.tar.gz (optional Servo engine), install.sh,
# harbor-android.apk (the phone app), SHA256SUMS, and a minisign .minisig for each. Harbor's
# updater checks those signatures with the public key in src/update.rs.
#
# Secrets: MINISIGN_SECRET_KEY (unencrypted minisign secret key file contents);
# ANDROID_KEYSTORE (base64 of the app's signing keystore), ANDROID_KEYSTORE_PASS,
# ANDROID_KEY_ALIAS. Every APK must be signed with that same key, or phones can't update.
name: release

# Pushes to main (each publish.sh) build everything except Servo (see browser.yml) but sign or
# release nothing. They exist to save the caches: a tag run can only restore caches saved on its
# own ref or on the default branch, so caches saved by a tag run were never seen again.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One run per ref; a newer push to main waits instead of cancelling (cancelled runs save no cache).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  MINISIGN_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73

jobs:
  core:
    # Oldest supported base: the binary needs glibc 2.35+ (Ubuntu 22.04, Debian 12, Arch, …).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Updater tests (version order, signatures)
        run: 'cargo test --locked -- update::'
      - run: cargo build --release --locked
        env:
          HARBOR_GIT_SHA: ${{ github.sha }}
      - run: ldd target/release/harbor && ./target/release/harbor --version
      - uses: actions/upload-artifact@v7
        with:
          name: harbor
          path: target/release/harbor

  # The phone app (android/build.sh: aapt2 + javac + d8 + apksigner, no Gradle). Main pushes
  # without the signing secrets sign with a throwaway key, only to prove it builds.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (platform 34, build-tools 34)
        run: |
          set -eu
          sdk="${ANDROID_HOME:-$HOME/android-sdk}"
          sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sm" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            mkdir -p "$sdk/cmdline-tools" && unzip -q /tmp/clt.zip -d /tmp/clt && mv /tmp/clt/cmdline-tools "$sdk/cmdline-tools/latest"
          fi
          yes | "$sm" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sm" --sdk_root="$sdk" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -eu
          umask 077
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/android.jks"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::ANDROID_KEYSTORE is not set"; exit 1
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/android.jks" -storepass throwaway -alias harbor \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" >/dev/null 2>&1
            echo "ANDROID_KEYSTORE_PASS=throwaway" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=harbor" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env:
          ANDROID_BUILD: /nonexistent
          ANDROID_KEYSTORE: ${{ runner.temp }}/android.jks
          SECRET_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OUT: ${{ github.workspace }}/out/harbor-android.apk
        run: |
          set -eu
          [ -z "$SECRET_PASS" ] || export ANDROID_KEYSTORE_PASS="$SECRET_PASS"
          [ -z "$SECRET_ALIAS" ] || export ANDROID_KEY_ALIAS="$SECRET_ALIAS"
          android/build.sh
          rm -f "$ANDROID_KEYSTORE"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging out/harbor-android.apk | head -3
      - uses: actions/upload-artifact@v7
        with:
          name: harbor-android
          path: out/harbor-android.apk

  # Never compiles Servo on a main push (no engine found = no browser in that run's package).
  # A tag compiles it only when browser/ changed and nobody ran the browser workflow on main.
  browser:
    uses: ./.github/workflows/browser.yml
    with:
      build: ${{ startsWith(github.ref, 'refs/tags/v') }}

  package:
    needs: [core, browser, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: art
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      # The licence reports (~3 min) only change with the dependencies or the template.
      - uses: actions/cache/restore@v6
        id: lic
        with:
          path: lic
          key: lic-${{ hashFiles('Cargo.lock', 'browser/Cargo.lock', 'packaging/about.toml', 'packaging/about.hbs') }}
      - uses: taiki-e/install-action@v2
        if: steps.lic.outputs.cache-hit != 'true'
        with:
          tool: cargo-about
      - name: Third-party licences
        id: about
        if: steps.lic.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p lic
          cargo about generate -c packaging/about.toml packaging/about.hbs -o lic/harbor.html
          (cd browser && cargo about generate -c ../packaging/about.toml ../packaging/about.hbs -o ../lic/harbor-browser.html)
      - uses: actions/cache/save@v6
        if: steps.lic.outputs.cache-hit != 'true' && steps.about.outcome == 'success'
        with:
          path: lic
          key: ${{ steps.lic.outputs.cache-primary-key }}
      - name: Assemble
        run: |
          set -eu
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist
          d=pkg/harbor-x86_64-linux
          mkdir -p "$d/licenses"
          install -m755 art/harbor/harbor "$d/harbor"
          # Harbor 0.17 and older refuse an update without harbor-stream (the screen viewer,
          # removed in 0.18): a placeholder keeps their in-app updates working.
          printf '#!/bin/sh\necho "harbor-stream was removed in Harbor 0.18" >&2\nexit 1\n' > "$d/harbor-stream"
          chmod 755 "$d/harbor-stream"
          install -m755 packaging/install.sh "$d/install.sh"
          cp packaging/harbor.desktop packaging/harbor.svg README.md CHANGELOG.md "$d/"
          rsvg-convert -w 256 -h 256 packaging/harbor.svg -o "$d/harbor-256.png"
          echo "$ver" > "$d/VERSION"
          # The engine's id, also when this run has no engine (only main pushes; tags always do).
          git rev-parse HEAD:browser > "$d/browser.id"
          cp LICENSE "$d/licenses/Harbor-MIT.txt"
          cp assets/fonts/OFL.txt "$d/licenses/Geist-OFL-1.1.txt"
          cp assets/fonts/LUCIDE-LICENSE.txt "$d/licenses/Lucide-ISC.txt"
          cp assets/logos/LOBE-ICONS-LICENSE.txt assets/logos/SIMPLE-ICONS-LICENSE.md "$d/licenses/"
          [ -f lic/harbor.html ] && cp lic/harbor.html "$d/licenses/third-party-harbor.html"

          b=pkg/harbor-browser-x86_64-linux
          if [ "${{ needs.browser.outputs.found }}" = "true" ]; then
            mkdir -p "$b/licenses"
            install -m755 art/harbor-browser/harbor-browser "$b/harbor-browser"
            cp art/harbor-browser/browser.id "$b/browser.id"
            cp browser/LICENSE "$b/licenses/harbor-browser-MIT.txt"
            [ -f lic/harbor-browser.html ] && cp lic/harbor-browser.html "$b/licenses/third-party-harbor-browser.html"
            echo "harbor-browser is MIT; it links Servo (MPL-2.0), whose source is at https://github.com/servo/servo" > "$b/licenses/README.txt"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::a release needs the browser engine"; exit 1
          fi
          # A checksum list inside each archive: install.sh run from an extracted folder checks it offline.
          for x in pkg/*/; do
            (cd "$x" && find . -type f ! -name 'SHA256SUMS*' | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS)
          done
      - name: Get minisign
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL "$MINISIGN_URL" -o /tmp/minisign.tgz
          echo "$MINISIGN_SHA256  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp 2>/dev/null
      - name: Sign the checksum lists inside the archives
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for x in harbor-x86_64-linux harbor-browser-x86_64-linux; do
            /tmp/minisign-linux/x86_64/minisign -S -s /tmp/minisign.key -m "pkg/$x/SHA256SUMS" -t "harbor $GITHUB_REF_NAME $x/SHA256SUMS"
          done
          rm -f /tmp/minisign.key
      - name: Pack
        run: |
          set -eu
          tar -C pkg -czf dist/harbor-x86_64-linux.tar.gz harbor-x86_64-linux
          [ ! -d pkg/harbor-browser-x86_64-linux ] || tar -C pkg -czf dist/harbor-browser-x86_64-linux.tar.gz harbor-browser-x86_64-linux
          cp packaging/install.sh dist/install.sh
          cp art/harbor-android/harbor-android.apk dist/harbor-android.apk
          (cd dist && sha256sum *.tar.gz install.sh harbor-android.apk > SHA256SUMS)
          ls -la dist
          tar -tzf dist/harbor-x86_64-linux.tar.gz | grep SHA256SUMS
      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          for f in dist/harbor-x86_64-linux.tar.gz dist/harbor-browser-x86_64-linux.tar.gz dist/install.sh dist/harbor-android.apk dist/SHA256SUMS; do
            /tmp/minisign-linux/x86_64/minisign -S -s /tmp/minisign.key -m "$f" -t "harbor $GITHUB_REF_NAME $(basename "$f")"
          done
          rm -f /tmp/minisign.key
          /tmp/minisign-linux/x86_64/minisign -Vm dist/harbor-x86_64-linux.tar.gz -p packaging/minisign.pub
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            dist/harbor-x86_64-linux.tar.gz
            dist/harbor-browser-x86_64-linux.tar.gz
            dist/install.sh
            dist/harbor-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section, then GitHub's generated notes.
          awk -v v="$ver" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          printf '\n**Install:** `curl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh`\n' "$GITHUB_REPOSITORY" >> notes.md
          printf '\n**Android:** download `harbor-android.apk` below, or scan the install QR code in Harbor › Settings › Phones.\n' >> notes.md
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Harbor $ver" --notes-file notes.md --generate-notes $pre
