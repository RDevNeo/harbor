# Puts Harbor's Slint addon (slint.yml's artifact harbor-slint) into a build sandbox at
# ~/src/slint/out, where .github/boat/build.sh finds it. A tag must have it; a run by hand without
# one builds with upstream's addon from npm.
name: Slint addon
description: Puts Harbor's Slint addon into a build sandbox
inputs:
  found:
    description: slint.yml's output `found`
    required: true
  sandbox:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      if: inputs.found == 'true'
      with:
        name: harbor-slint
        path: ${{ runner.temp }}/harbor-slint
    - name: Copy it to the sandbox
      shell: bash
      env:
        FOUND: ${{ inputs.found }}
        ID: ${{ inputs.sandbox }}
      run: |
        set -eu
        if [ "$FOUND" != true ]; then
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::a release needs Harbor's Slint addon"; exit 1; fi
          echo "::warning::no Harbor Slint addon: this run builds with upstream's"; exit 0
        fi
        tar -czf "$RUNNER_TEMP/slint.tgz" -C "$RUNNER_TEMP/harbor-slint" .
        # 5 minutes, not boat exec's default 30 s, which a sandbox whose disk is still loading
        # outlasted (run 41785392463); and 3 tries.
        for try in 1 2 3; do
          "$HOME/.local/bin/boat" scp "$RUNNER_TEMP/slint.tgz" "$ID:/home/user/slint.tgz" \
            && "$HOME/.local/bin/boat" exec "$ID" --timeout 300 -- bash -c 'rm -rf src/slint/out && mkdir -p src/slint/out && tar -xzf slint.tgz -C src/slint/out && rm slint.tgz && ls -la src/slint/out/*/' \
            && exit 0
          [ "$try" = 3 ] || { echo "::warning::copying the addon failed (try $try of 3)"; sleep 10; }
        done
        exit 1
