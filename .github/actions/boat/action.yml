# Callers must delete the sandbox in an `if: always()` step; --ttl only backstops a job that dies first.
name: boat sandbox
inputs:
  key:
    required: true
  type:
    default: large
  from:
    description: Saved snapshot to start from; without it (or if it is gone), a clean sandbox
    default: ""
outputs:
  id:
    value: ${{ steps.box.outputs.id }}
runs:
  using: composite
  steps:
    - name: boat CLI
      shell: bash
      env:
        BOAT_API_KEY: ${{ inputs.key }}
      run: |
        set -eu
        "$GITHUB_ACTION_PATH/../../boat/cli.sh"
        # boat reads the key from the environment; `boat login` keeps nothing on a runner (no keyring).
        echo "BOAT_API_KEY=$BOAT_API_KEY" >> "$GITHUB_ENV"
    - name: Sandbox
      id: box
      shell: bash
      env:
        FROM: ${{ inputs.from }}
        TYPE: ${{ inputs.type }}
      run: |
        set -eu
        boat=$HOME/.local/bin/boat
        # The name finds the sandbox again: .github/boat/cleanup.sh deletes by it.
        name="ci-harbor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
        echo "BOAT_SANDBOX=$name" >> "$GITHUB_ENV"
        named() { "$boat" list --all --json | jq -r --arg n "$name" '[.sandboxes[] | select(.name == $n)][0].id // empty'; }
        new() { "$boat" new --type "$TYPE" --no-env --ttl 7200 --name "$name" --json "$@" | tee /dev/stderr | jq -r 'select(.event == "ready") | .id'; }
        # A create that times out on the way back may still have made the sandbox: take that one
        # instead of a second. Only a snapshot that keeps failing falls back to a clean sandbox.
        id=""
        for try in 1 2 3; do
          id=$(named)
          [ -z "$id" ] || break
          if [ -n "$FROM" ] && [ "$try" -lt 3 ]; then id=$(new --from "$FROM" || true); else id=$(new || true); fi
          [ -z "$id" ] || break
          sleep 10
        done
        test -n "$id"
        for try in $(seq 30); do "$boat" exec "$id" --timeout 60 -- true >/dev/null 2>&1 && break; sleep 5; done
        echo "id=$id" >> "$GITHUB_OUTPUT"
    - name: Copy the source
      shell: bash
      run: |
        set -eu
        git archive --format=tar.gz -o "$RUNNER_TEMP/src.tgz" HEAD
        "$HOME/.local/bin/boat" scp "$RUNNER_TEMP/src.tgz" "${{ steps.box.outputs.id }}:/home/user/src.tgz"
        "$HOME/.local/bin/boat" exec "${{ steps.box.outputs.id }}" -- bash -c 'mkdir src && tar -xzf src.tgz -C src && rm src.tgz'
